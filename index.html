<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro Islâmico de Joinville - Horário das Orações</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #e8e8e8;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    font-family: 'Tajawal', sans-serif;
    padding: 16px;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 520px;
    border-radius: 18px;
    padding: clamp(16px, 5vw, 28px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }

  /* ── TOP ROW ── */
  .top-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 18px;
  }

  .location-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
    gap: 5px;
    width: clamp(80px, 22vw, 110px);
  }

  .pin-icon {
    font-size: clamp(28px, 8vw, 40px);
    line-height: 1;
  }

  .location-text {
    font-size: clamp(10px, 2.8vw, 13px);
    color: #333;
    text-align: center;
    font-weight: 600;
    line-height: 1.4;
  }

  .title-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    min-width: 0;
  }

  .arabic-title {
    font-family: 'Amiri', serif;
    font-size: clamp(18px, 5.5vw, 28px);
    color: #1a7a30;
    direction: rtl;
    line-height: 1.3;
    font-weight: 700;
    width: 100%;
  }

  .mosque-icon-row {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }

  .mosque-svg {
    width: clamp(24px, 6vw, 34px);
    height: clamp(24px, 6vw, 34px);
    flex-shrink: 0;
  }

  .portuguese-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(10px, 3vw, 15px);
    color: #1a7a30;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    line-height: 1.3;
  }

  /* ── MIDDLE ROW ── */
  .middle-row {
    display: flex;
    gap: clamp(10px, 3vw, 18px);
    align-items: flex-start;
  }

  /* ── SIDE BLOCK ── */
  .side-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    width: clamp(80px, 22vw, 108px);
  }

  .badge-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .clock-badge {
    position: relative;
    width: clamp(72px, 20vw, 92px);
    height: clamp(72px, 20vw, 92px);
    background: radial-gradient(circle at 40% 30%, #2e8b3c, #1a5c24);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 3px solid #1a5c24;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    overflow: hidden;
  }

  .clock-badge::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.3);
  }

  .mosque-silhouette {
    font-size: clamp(24px, 7vw, 34px);
    line-height: 1;
  }

  .badge-label {
    background: #c0392b;
    color: white;
    font-family: 'Amiri', serif;
    font-size: clamp(7px, 2vw, 10px);
    padding: 2px 5px;
    border-radius: 4px;
    margin-top: 2px;
    direction: rtl;
    white-space: nowrap;
  }

  .badge-subtitle {
    font-size: clamp(8px, 2.2vw, 10px);
    color: #555;
    font-weight: 700;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-top: 5px;
    line-height: 1.3;
  }

  .calendar-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .calendar-icon {
    font-size: clamp(36px, 10vw, 52px);
    line-height: 1;
  }

  .calendar-month {
    font-size: clamp(11px, 3vw, 14px);
    font-weight: 700;
    color: #222;
    text-align: center;
  }

  /* ── PRAYER TABLE ── */
  .prayer-table-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .prayer-table {
    background: #1e8c3a;
    border-radius: 12px 12px 0 0;
    padding: clamp(10px, 3vw, 16px) clamp(8px, 2.5vw, 14px);
  }

  .table-header {
    display: grid;
    grid-template-columns: 1.1fr 1fr 1fr;
    gap: 5px;
    margin-bottom: 9px;
    padding: 0 2px;
  }

  .table-header span {
    color: #fff;
    font-size: clamp(10px, 2.8vw, 13px);
    font-weight: 800;
    text-align: center;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .table-header span:first-child { text-align: left; }

  .prayer-row {
    display: grid;
    grid-template-columns: 1.1fr 1fr 1fr;
    gap: 5px;
    margin-bottom: 6px;
    align-items: stretch;
  }

  .prayer-row:last-child { margin-bottom: 0; }

  .prayer-name {
    background: #fff;
    border-radius: 7px;
    padding: clamp(7px, 2vw, 10px) 4px;
    font-size: clamp(13px, 4vw, 18px);
    font-weight: 800;
    color: #111;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .time-cell {
    background: #f7f2e8;
    border-radius: 7px;
    padding: clamp(7px, 2vw, 10px) 4px;
    text-align: center;
    font-size: clamp(13px, 4vw, 18px);
    font-weight: 800;
    color: #c0392b;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Jumu'ah footer */
  .jummah-bar {
    background: #1e8c3a;
    border-radius: 0 0 12px 12px;
    border-top: 2px solid #27ae60;
    padding: clamp(7px, 2vw, 10px) 12px;
    text-align: center;
  }

  .jummah-bar span {
    color: #fff;
    font-size: clamp(12px, 3.5vw, 16px);
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: rgba(255,255,255,0.65);
  }

  /* ── VERY SMALL SCREENS: stack side horizontally ── */
  @media (max-width: 360px) {
    .middle-row { flex-direction: column; }
    .side-block {
      width: 100%;
      flex-direction: row;
      justify-content: space-around;
      gap: 8px;
    }
  }
</style>
</head>
<body>

<div class="card">

  <!-- TOP ROW -->
  <div class="top-row">
    <div class="location-block">
      <div class="pin-icon">📍</div>
      <div class="location-text">Av. Coronel Procópio<br>Gomes, 140-Joinville</div>
    </div>
    <div class="title-block">
      <div class="arabic-title">المركز الإسلامي بجوينفيلي</div>
      <div class="mosque-icon-row">
        <svg class="mosque-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="28" width="44" height="28" rx="2" fill="#1a7a30"/>
          <rect x="18" y="36" width="10" height="20" rx="1" fill="#fff"/>
          <rect x="36" y="36" width="10" height="20" rx="1" fill="#fff"/>
          <path d="M32 6 C24 6 18 14 18 22 L46 22 C46 14 40 6 32 6Z" fill="#1a7a30"/>
          <circle cx="32" cy="6" r="3" fill="#27ae60"/>
          <line x1="32" y1="1" x2="32" y2="4" stroke="#27ae60" stroke-width="1.5"/>
          <rect x="8" y="24" width="8" height="32" rx="2" fill="#27ae60"/>
          <rect x="48" y="24" width="8" height="32" rx="2" fill="#27ae60"/>
          <circle cx="12" cy="22" r="3" fill="#27ae60"/>
          <circle cx="52" cy="22" r="3" fill="#27ae60"/>
        </svg>
        <div class="portuguese-title">Centro Islâmico de Joinville</div>
      </div>
    </div>
  </div>

  <!-- MIDDLE ROW -->
  <div class="middle-row">

    <!-- Side icons -->
    <div class="side-block">
      <div class="badge-wrap">
        <div class="clock-badge">
          <div class="mosque-silhouette">🕌</div>
          <div class="badge-label">مواقيت الصلاة</div>
        </div>
        <div class="badge-subtitle">Horário<br>das Orações</div>
      </div>
      <div class="calendar-badge">
        <div class="calendar-icon">📅</div>
        <div class="calendar-month">Março 2026</div>
      </div>
    </div>

    <!-- Table + footer -->
    <div class="prayer-table-wrap">
      <div class="prayer-table">
        <div class="table-header">
          <span>SALAH</span>
          <span>AZAN</span>
          <span>IQAMA</span>
        </div>
        <div class="prayer-row">
          <div class="prayer-name">Fajr</div>
          <div class="time-cell">06:00</div>
          <div class="time-cell">06:05</div>
        </div>
        <div class="prayer-row">
          <div class="prayer-name">Zuhr</div>
          <div class="time-cell">13:00</div>
          <div class="time-cell">13:05</div>
        </div>
        <div class="prayer-row">
          <div class="prayer-name">Asr</div>
          <div class="time-cell">16:00</div>
          <div class="time-cell">16:05</div>
        </div>
        <div class="prayer-row">
          <div class="prayer-name">Maghrib</div>
          <div class="time-cell">18:30</div>
          <div class="time-cell">18:30</div>
        </div>
        <div class="prayer-row">
          <div class="prayer-name">Ishaa</div>
          <div class="time-cell">19:40</div>
          <div class="time-cell">19:40</div>
        </div>
      </div>
      <div class="jummah-bar">
        <span>Sexta-feira 13h00</span>
      </div>
    </div>

  </div>

</div>

</body>
</html>
